services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    image: ibal/backend:1.0.0
    container_name: IBAL-backend

    restart: unless-stopped

    env_file:
      - .env

    expose:
      - "8080"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:17

    container_name: IBAL-postgres

    restart: unless-stopped
    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend-network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres-backup:
    image: postgres:17

    container_name: IBAL-postgres-backup

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - backup-data:/backups

    networks:
      - backend-network

    command: >
      sh -c "
      while true;
      do
        pg_dump -h postgres -U $$POSTGRES_USER $$POSTGRES_DB > /backups/backup-$$(date +%F-%H-%M).sql
        sleep 86400
      done"

  nginx:

     image: nginx:1.28-alpine
  
     ports:
         - "80:80"
  
     volumes:
       - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
 
     depends_on:
        backend:
          condition: service_started

     networks:
        - backend-network 
    
     logging:
         driver: json-file
         options:
               max-size: "10m"
               max-file: "5"

volumes:
  postgres-data:
  backup-data:

networks:
  backend-network:
    driver: bridge
